      <path d="M 405 240 C 475 240 490 210 550 210" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)" />
      <text x="450" y="420" text-anchor="middle" font-size="20" fill="#344054">project.kicad_sch references child sheets that are absent from the ZIP.</text>
