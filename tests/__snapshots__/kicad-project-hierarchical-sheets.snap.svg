      <text x="90" y="190" font-size="22" fill="#172033">project.kicad_pcb</text><text x="90" y="232" font-size="22" fill="#172033">project.kicad_pro</text><text x="90" y="274" font-size="22" fill="#172033">project.kicad_sch</text>
      <text x="700" y="110" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">FILES REFERENCED BY ROOT</text>
      <g transform="translate(570 160)">
          <rect width="260" height="68" rx="8" fill="#fff1f1" stroke="#d7263d" stroke-width="3" stroke-dasharray="10 8" />
          <text x="130" y="30" text-anchor="middle" font-size="21" fill="#9f1427">logic.kicad_sch</text>
          <text x="130" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="#d7263d">MISSING FROM ZIP</text>
        </g><g transform="translate(570 260)">
